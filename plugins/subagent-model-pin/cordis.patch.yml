# Bundle layer: applied when the profile selects this package (dsh.profile.bundles).
# Override any value from the profile's own cordis.patch.yml with:
#   - id: subagent-model-pin
#     config: { ... }        # config is replaced wholesale, not deep-merged
- insert:
    - id: subagent-model-pin
      name: subagent-model-pin
      config:
        # 0.4.0：默认值必须是 stock 安装可用的路由（本插件是开源分发）。
        # deepseek-official 是官方 bundle 自带的 provider，目录含 deepseek-flash；
        # 该模型不声明 reasoning effort 档位，所以默认不 pin effort。
        # 换便宜路由用插件页配置卡（volatile 四字段），或 profile 按 id 整段覆盖。
        provider: deepseek-official
        model: deepseek-flash
        # reasoningEffort: high            # 可选：pin 时一并写入的 effort
        injectDelegationDefaults: true   # false = 关闭 tools/execute 注入，退回 agent/created 时 select 兜底
        debug: false                     # true 时写 %TEMP%\subagent-model-pin.log
        # roles 已退役（0.5.0）：老 profile 的 roles 仍可加载（schema 保留），但运行期
        # 完全忽略，apply 时只发一次迁移提示。只读评审/勘察/spike 的路由与沙箱由
        # dispatch-protocol 的组合结构钉死；普通 subagent 不再按角色分档，默认路由
        # 见顶层 provider/model。迁移说明见 README「版本历史」0.5.0。

