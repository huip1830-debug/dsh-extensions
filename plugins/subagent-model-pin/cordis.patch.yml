# Bundle layer: applied when the profile selects this package (dsh.profile.bundles).
# Override any value from the profile's own cordis.patch.yml with:
#   - id: subagent-model-pin
#     config: { ... }        # config is replaced wholesale, not deep-merged
- insert:
    - id: subagent-model-pin
      name: subagent-model-pin
      config:
        provider: opencode-go
        model: deepseek-v4.1-flash
        reasoningEffort: high
        injectDelegationDefaults: true   # false = 关闭 tools/execute 注入，退回纯 request 层 pin
        debug: false                     # true 时写 %TEMP%\subagent-model-pin.log
        # roles:                           # 按委派 description 前缀分档；显式 provider/model 仍然优先
        #   - match: Survey                # 前缀匹配，大小写不敏感
        #     provider: deepseek-official
        #     model: deepseek-flash
        #     sandbox: read-only           # 可选：收窄该角色子会话的沙箱（read-only/workspace-write/danger-full-access）
        #   - match: Implement
        #     provider: opencode-go
        #     model: deepseek-v4.1-flash

