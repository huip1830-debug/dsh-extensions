# Bundle layer: applied when the profile selects this package (dsh.profile.bundles).
# Override any value from the profile's own cordis.patch.yml with:
#   - id: dispatch-protocol
#     config: { ... }        # config is replaced wholesale, not deep-merged
- insert:
    - id: dispatch-protocol
      name: dispatch-protocol
      config:
        enabled: true
        order: 500            # ordering within the system prompt (lower runs earlier)
        # rules: []           # override the six defaults; non-empty string array
        # footer: ''          # override the closing paragraph (cost + exemption); '' drops it
        # log: false          # shared decision log (checkpoint + write-policy + gates); default %TEMP%/dispatch-protocol-decisions.jsonl, false disables all
        writePolicy:          # 0.9.0 write guard: blocks a root agent's direct write to the execution plane at the tool boundary
          enabled: true       # master switch; the guard is registered through ctx.tools.guard
          mode: enforce       # enforce | shadow (shadow logs the denial and lets the call through)
          # allowlist: ['dispatch/', 'docs/superpowers/specs/']   # control-plane prefixes, cwd-relative, case-insensitive, word-boundary matched
          # overridePath: 'dispatch/override.json'                # the only exemption artifact: {"reason": "..."} written in this session
          # tools: ['write', 'edit']                              # tools the guard inspects (default write, edit)
          # delegationTools: ['subagent', 'subagent_fork', 'workflow']   # shared with observation rows and WaitGate
        checkpoint:
          enabled: true       # remind the parent when a child completes (judged at the parent's next turn-stopping)
          # text: ''          # overrides DEFAULT_CHECKPOINT; supports {childId} and {label}
        # gates:                # 0.6.0/0.7.0 event gates: Wait + Verify + Contract + Review + Handoff
        #   enabled: true       # master switch for all five gates; judged at the root agent's turn-stopping
        #   wait:
        #     enabled: true
        #     threshold: 3      # >= this many status-query calls and no write/dispatch/verify in the turn
        #     tools: ['list_agents', 'job_list', 'schedule_list', 'get_goal']
        #     # text: ''        # overrides DEFAULT_WAIT_TEXT; supports {count} {tools}
        #   verify:
        #     enabled: true
        #     commands: ['npm test', 'npm run build', 'dotnet test', 'jest', 'tsc', 'prisma migrate deploy', 'node test', 'test.mjs']
        #     # commitPattern: '\bgit\s+(commit|push)\b'  # YAML single-quoted regex; full default is DEFAULT_VERIFY_COMMIT_PATTERN in lib/gates.mjs
        #     # text: ''        # overrides DEFAULT_VERIFY_TEXT; supports {files} {kind} {action}; legacy {changes} {lastVerify}
        #   contract:             # 0.7.0 ContractGate: contract files edited while a child is still running
        #     enabled: true
        #     patterns: ['contract']          # case-insensitive path substrings; supports {files}
        #     # text: ''        # overrides DEFAULT_CONTRACT_TEXT
        #   review:               # 0.7.0 ReviewGate: parent writes after a read-only review completed
        #     enabled: true
        #     labelPrefixes: ['只读评审', '只读复审']
        #     # text: ''        # overrides DEFAULT_REVIEW_TEXT; supports {files} {action}
        #   handoff:              # 0.7.0 HandoffGate: consecutive empty turns
        #     enabled: true
        #     emptyTurns: 1     # consecutive turns with no tool/call and no non-empty text
        #     # text: ''        # overrides DEFAULT_HANDOFF_TEXT; supports {emptyTurns}
