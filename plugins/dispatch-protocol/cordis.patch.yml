# Bundle layer: applied when the profile selects this package (dsh.profile.bundles).
# Override any value from the profile's own cordis.patch.yml with:
#   - id: dispatch-protocol
#     config: { ... }        # config is replaced wholesale, not deep-merged
- insert:
    - id: dispatch-protocol
      name: dispatch-protocol
      config:
        enabled: true
        order: 500            # ordering within the system prompt (lower runs earlier)
        # rules: []           # override the six defaults; non-empty string array
        # footer: ''          # override the closing paragraph (cost + exemption); '' drops it
        # log: false          # shared decision log (checkpoint + write-policy); default %TEMP%/dispatch-protocol-decisions.jsonl, false disables all
        writePolicy:          # 0.9.0 write guard: blocks a root agent's direct write to the execution plane at the tool boundary
          enabled: true       # master switch; the guard is registered through ctx.tools.guard
          mode: enforce       # enforce | shadow (shadow logs the denial and lets the call through)
          # allowlist: ['dispatch/', 'docs/superpowers/specs/']   # control-plane prefixes, cwd-relative, case-insensitive, word-boundary matched
          # overridePath: 'dispatch/override.json'                # the only exemption artifact: {"reason": "..."} written in this session
          # tools: ['write', 'edit']                              # tools the guard inspects (default write, edit)
          # delegationTools: ['subagent', 'subagent_fork', 'workflow', 'subagent_readonly']   # shared with observation rows
        checkpoint:
          enabled: true       # remind the parent when a child completes (judged at the parent's next turn-stopping)
          # text: ''          # overrides DEFAULT_CHECKPOINT; supports {childId} and {label}
        # projectSwitch:        # 0.13.0 per-project switch: {"mode":"off"|"auto"|"shadow"|"full"} in a marker file
        #   enabled: true       # master switch; false restores 0.12.3 behavior (the marker file is never read)
        #   path: 'dispatch/protocol.json'   # marker file, session-cwd relative; missing/bad file falls back to auto (0.16.0)
        #   # 0.15.0: the same file is a project policy — optional rules/allowlist override the
        #   # profile per field; an invalid field falls back alone, missing/bad JSON falls back
        #   # entirely. rules: 'business' (~1.1K) trims the default ~3.8K text; `/dispatch init`
        #   # writes a detected policy file, never overwriting an existing one. 0.17.0: the
        #   # gate-only fields (controlPlanePatterns / verify.commands / contract.patterns /
        #   # docs.patterns) were removed with the five turn-end gates.
        #   # 0.16.0: the default is auto (a ~470-char escalation hint, no guard/checkpoints). The root
        #   # agent may ask; after the user confirms it calls `dispatch_upgrade_full`, visible only in auto, which
        #   # writes mode:"full" atomically and preserves the other policy fields. Downgrades stay user-only.
    # 0.21.0 只读评审/勘察：Host 全局委派工具 subagent_readonly = spawn + dispatch-readonly preset。
    # 该 preset 没有写工具、也没有 shell（只有 read / readImage / grep / glob）。
    # 0.22.0：agentOptions 在创建时钉死路由（descriptor / 首请求 / 冷恢复三者一致，
    # adapter 预检、不经会话白名单）；沙箱收窄改由本插件 readonlySandbox 按
    # agent-preset/selected 结构判定。spike 要跑命令实测，仍走普通 subagent。
    - id: preset-dispatch-readonly
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dispatch-readonly
        name: 只读评审/勘察
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是派发纪律的只读子代理（评审/复审/勘察）。你的组合里没有写入工具与
                shell：只能 read/grep/glob。输入材料（需求、冻结契约、diff、集成结果）
                由派发词与 dispatch/ 下的文件提供；材料不足或与代码不符时停报
                NEEDS_CONTEXT，不得扩大范围、不得尝试写文件。评审逐条给
                PASS|FAIL + 文件:行号；勘察给「文件:行号 + 相关代码 + 结论 +
                不确定项」。结论以 final message 回传。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-subagent-readonly
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_readonly
        agentPreset: dispatch-readonly
        modelSelection: false
        # 0.22.0：创建时钉死评审角色的低成本路由；要换路由在 profile 层按 id
        # 整段覆盖本行（config 整体替换，不深合并）。
        # 0.23.0：默认值必须是 stock 安装可用的路由（本插件是开源分发）——
        # deepseek-official 是官方 bundle 自带 provider；deepseek-flash 不声明
        # reasoning effort 档位，所以默认不 pin effort。
        agentOptions:
          provider: deepseek-official
          model: deepseek-flash
