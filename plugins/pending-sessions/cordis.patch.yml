# Bundle layer: applied when the profile selects this package (dsh.profile.bundles).
#
# The feature itself is the browser half (client.js). This Host row still has to
# exist because the client module system discovers client bundles per *active
# Loader entry*: the constructor scans ctx.loader.entries(), processOne skips
# rows without a mounted fiber or disabled, and resolveMeta resolves
# exports["./client"] from the row's package manifest
# (dsh-client-modules/lib/index.js:571, :615, :911, :783-803 in 0.2.2-rc.1).
# A package that only ships client.js would never be scanned, so plugin.mjs is
# an intentional no-op.
- insert:
    - id: pending-sessions
      name: pending-sessions
