name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - subagent-model-pin
          - dispatch-protocol
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (only for plugins that declare them)
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi

      - name: Run offline regression
        working-directory: plugins/${{ matrix.plugin }}
        run: node test.mjs
